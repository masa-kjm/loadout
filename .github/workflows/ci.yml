name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test (non-macOS)
        id: non_macos_test
        if: matrix.os != 'macos-latest'
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: cargo test --locked

      - name: cargo test (macOS APFS fixture)
        id: macos_test
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -o pipefail
          TMPDIR="$RUNNER_TEMP" cargo test --locked 2>&1 | tee macos-platform-test.log

      - name: Native file-copy primitive probe
        id: native_copy_probe
        env:
          LOADOUT_NATIVE_FIXTURE_ROOT: ${{ runner.temp }}
        run: cargo test --locked --test native_copy_platform

      - name: Candidate copy-action compiled CLI evidence
        id: candidate_copy_cli
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: cargo test --locked --features copy-candidate-actions --test cli_read_only candidate_sequential_copy_actions_apply_and_commit_known_state

      - name: Record file-copy capability matrix
        id: copy_capability_matrix
        if: always()
        env:
          LOADOUT_NATIVE_FIXTURE_ROOT: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: python .github/scripts/run-copy-capability-matrix.py

      - name: Record Linux platform evidence
        if: always() && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          fixture_filesystem="$(findmnt --noheadings --output FSTYPE --target "$RUNNER_TEMP")"
          test "$fixture_filesystem" = ext4
          {
            echo "runner_os=${RUNNER_OS}"
            uname -a
            echo "fixture_tmpdir=${RUNNER_TEMP}"
            echo "fixture_filesystem=${fixture_filesystem}"
            rustc -Vv
            cargo -V
            echo "command=cargo test --locked"
            echo "test_step_outcome=${{ steps.non_macos_test.outcome }}"
            echo "native_copy_probe_command=cargo test --locked --test native_copy_platform"
            echo "native_copy_probe_outcome=${{ steps.native_copy_probe.outcome }}"
            echo "candidate_copy_cli_command=cargo test --locked --features copy-candidate-actions --test cli_read_only candidate_sequential_copy_actions_apply_and_commit_known_state"
            echo "candidate_copy_cli_outcome=${{ steps.candidate_copy_cli.outcome }}"
            echo "copy_capability_matrix_command=python .github/scripts/run-copy-capability-matrix.py"
            echo "copy_capability_matrix_outcome=${{ steps.copy_capability_matrix.outcome }}"
          } | tee linux-platform-evidence.txt

      - name: Record macOS platform evidence
        if: always() && matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          fixture_device="$(df -P "$RUNNER_TEMP" | awk 'NR == 2 { print $1 }')"
          fixture_filesystem="$(diskutil info "$fixture_device" | awk -F: '/Type \(Bundle\)/ { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print tolower($2); exit }')"
          test "$fixture_filesystem" = apfs
          {
            echo "runner_os=${RUNNER_OS}"
            sw_vers
            echo "fixture_tmpdir=${RUNNER_TEMP}"
            echo "fixture_filesystem=${fixture_filesystem}"
            rustc -Vv
            cargo -V
            echo "command=TMPDIR=${RUNNER_TEMP} cargo test --locked"
            echo "test_step_outcome=${{ steps.macos_test.outcome }}"
            echo "native_copy_probe_command=cargo test --locked --test native_copy_platform"
            echo "native_copy_probe_outcome=${{ steps.native_copy_probe.outcome }}"
            echo "candidate_copy_cli_command=cargo test --locked --features copy-candidate-actions --test cli_read_only candidate_sequential_copy_actions_apply_and_commit_known_state"
            echo "candidate_copy_cli_outcome=${{ steps.candidate_copy_cli.outcome }}"
            echo "copy_capability_matrix_command=python .github/scripts/run-copy-capability-matrix.py"
            echo "copy_capability_matrix_outcome=${{ steps.copy_capability_matrix.outcome }}"
          } | tee macos-platform-evidence.txt

      - name: Record Windows platform evidence
        if: always() && matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixture = Get-Item $env:RUNNER_TEMP
          $volume = Get-Volume -DriveLetter $fixture.PSDrive.Name
          if ($volume.FileSystem -ne 'NTFS') {
            throw "expected NTFS fixture filesystem, found $($volume.FileSystem)"
          }
          @(
            "runner_os=$env:RUNNER_OS"
            (Get-ComputerInfo | Select-Object -ExpandProperty WindowsVersion | ForEach-Object { "windows_version=$_" })
            "fixture_tmpdir=$env:RUNNER_TEMP"
            "fixture_filesystem=$($volume.FileSystem)"
            (rustc -Vv)
            (cargo -V)
            'command=cargo test --locked'
            'test_step_outcome=${{ steps.non_macos_test.outcome }}'
            'native_copy_probe_command=cargo test --locked --test native_copy_platform'
            'native_copy_probe_outcome=${{ steps.native_copy_probe.outcome }}'
            'candidate_copy_cli_command=cargo test --locked --features copy-candidate-actions --test cli_read_only candidate_sequential_copy_actions_apply_and_commit_known_state'
            'candidate_copy_cli_outcome=${{ steps.candidate_copy_cli.outcome }}'
            'copy_capability_matrix_command=python .github/scripts/run-copy-capability-matrix.py'
            'copy_capability_matrix_outcome=${{ steps.copy_capability_matrix.outcome }}'
          ) | Set-Content -Encoding utf8 windows-platform-evidence.txt

      - name: Upload platform evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-platform-evidence
          path: |
            *-platform-evidence.txt
            macos-platform-test.log
            docs/development/copy-platform-decision-record.md
            copy-capability-matrix.json
            copy-capability-*.log
          if-no-files-found: error
          retention-days: 30
