name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test (non-macOS)
        id: non_macos_test
        if: matrix.os != 'macos-latest'
        run: cargo test --locked

      - name: cargo test (macOS APFS fixture)
        id: macos_test
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -o pipefail
          TMPDIR="$RUNNER_TEMP" cargo test --locked 2>&1 | tee macos-platform-test.log

      - name: Record Linux platform evidence
        if: always() && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          fixture_filesystem="$(findmnt --noheadings --output FSTYPE --target "$RUNNER_TEMP")"
          test "$fixture_filesystem" = ext4
          {
            echo "runner_os=${RUNNER_OS}"
            uname -a
            echo "fixture_tmpdir=${RUNNER_TEMP}"
            echo "fixture_filesystem=${fixture_filesystem}"
            rustc -Vv
            cargo -V
            echo "command=cargo test --locked"
            echo "test_step_outcome=${{ steps.non_macos_test.outcome }}"
          } | tee linux-platform-evidence.txt

      - name: Record macOS platform evidence
        if: always() && matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          fixture_filesystem="$(diskutil info -plist "$RUNNER_TEMP" | plutil -extract FilesystemType raw -)"
          test "$fixture_filesystem" = APFS
          {
            echo "runner_os=${RUNNER_OS}"
            sw_vers
            echo "fixture_tmpdir=${RUNNER_TEMP}"
            echo "fixture_filesystem=${fixture_filesystem}"
            rustc -Vv
            cargo -V
            echo "command=TMPDIR=${RUNNER_TEMP} cargo test --locked"
            echo "test_step_outcome=${{ steps.macos_test.outcome }}"
          } | tee macos-platform-evidence.txt

      - name: Record Windows platform evidence
        if: always() && matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixture = Get-Item $env:RUNNER_TEMP
          $volume = Get-Volume -DriveLetter $fixture.PSDrive.Name
          if ($volume.FileSystem -ne 'NTFS') {
            throw "expected NTFS fixture filesystem, found $($volume.FileSystem)"
          }
          @(
            "runner_os=$env:RUNNER_OS"
            (Get-ComputerInfo | Select-Object -ExpandProperty WindowsVersion | ForEach-Object { "windows_version=$_" })
            "fixture_tmpdir=$env:RUNNER_TEMP"
            "fixture_filesystem=$($volume.FileSystem)"
            (rustc -Vv)
            (cargo -V)
            'command=cargo test --locked'
            'test_step_outcome=${{ steps.non_macos_test.outcome }}'
          ) | Set-Content -Encoding utf8 windows-platform-evidence.txt

      - name: Upload platform evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-platform-evidence
          path: |
            *-platform-evidence.txt
            macos-platform-test.log
          if-no-files-found: error
          retention-days: 30
