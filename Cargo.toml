[package]
name = "loadout"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "A local environment manager with explicit desired state"
license = "MIT"
repository = "https://github.com/masa-kjm/loadout"

[lib]
name = "loadout"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json_canonicalizer = "0.3.2"
sha2 = "0.10.9"
