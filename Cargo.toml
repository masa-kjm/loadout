[package]
name = "loadout"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "A local environment manager with explicit desired state"
license = "MIT"
repository = "https://github.com/masa-kjm/loadout"

[lib]
name = "loadout"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
serde_json_canonicalizer = "0.3.2"
serde_yaml = "0.9"
sha2 = "0.10.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }
